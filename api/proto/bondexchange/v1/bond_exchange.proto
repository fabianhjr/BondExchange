syntax = "proto3";

package bondexchange.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/fabianhjr/BondExchange/gen/go/bondexchange/v1;bondexchangev1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Bond Exchange API"
    version: "1.0.0"
    description: "REST and gRPC API for publishing and buying sale offers."
  }
  consumes: "application/json"
  produces: "application/json"
};

// BondExchangeService exposes the bond-sale application over gRPC and REST.
service BondExchangeService {
  // Buy purchases one currently active sale offer for a buyer.
  rpc Buy(BuyRequest) returns (BuyResponse) {
    option (google.api.http) = {
      post: "/buys"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "201"
        value: {
          description: "The offer was purchased."
          schema: {
            json_schema: {ref: ".bondexchange.v1.BuyResponse"}
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "The request is invalid."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "The buyer or active offer was not found."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "The server could not complete the request."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
    };
  }

  // CreateSaleOffer publishes a new sale offer for an existing seller and bond series.
  rpc CreateSaleOffer(CreateSaleOfferRequest) returns (CreateSaleOfferResponse) {
    option (google.api.http) = {
      post: "/sale-offers"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "201"
        value: {
          description: "The sale offer was created."
          schema: {
            json_schema: {ref: ".bondexchange.v1.CreateSaleOfferResponse"}
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "The sale offer is invalid."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "The seller or bond series does not exist."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "The sale-offer ID already exists."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "The server could not complete the request."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
    };
  }

  // ListActiveOffers returns every active sale offer for one required bond series.
  rpc ListActiveOffers(ListActiveOffersRequest) returns (ListActiveOffersResponse) {
    option (google.api.http) = {get: "/active-offers"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "The active sale offers."
          schema: {
            json_schema: {ref: ".bondexchange.v1.ListActiveOffersResponse"}
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "The required bond series is missing or invalid."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "The server could not complete the request."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
    };
  }

  // ListActiveBondSeries returns every bond series having at least one active offer.
  rpc ListActiveBondSeries(ListActiveBondSeriesRequest) returns (ListActiveBondSeriesResponse) {
    option (google.api.http) = {get: "/active-bond-series"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "The bond series having active offers."
          schema: {
            json_schema: {ref: ".bondexchange.v1.ListActiveBondSeriesResponse"}
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "The server could not complete the request."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
    };
  }

  // CheckHealth reports whether the server can reach its database.
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse) {
    option (google.api.http) = {get: "/healthz"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "The service is healthy."
          schema: {
            json_schema: {ref: ".bondexchange.v1.CheckHealthResponse"}
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "The database is unavailable."
          schema: {
            json_schema: {ref: ".bondexchange.v1.Error"}
          }
        }
      }
    };
  }
}

message BuyRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["buyer_id", "sale_offer_id"]}
  };

  string buyer_id = 1;
  string sale_offer_id = 2;
}

message CreateSaleOfferRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["id", "seller_id", "bond_series", "price", "currency_code"]}
  };

  string id = 1;
  string seller_id = 2;
  // Bond series to sell. The service canonicalizes this value to uppercase.
  string bond_series = 3;
  // Exact positive decimal monetary amount encoded as a string.
  string price = 4;
  string currency_code = 5;
}

message CreateSaleOfferResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["offer"]}
  };

  SaleOffer offer = 1;
}

message ListActiveOffersRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["bond"]}
  };

  // Required bond series to list. The service canonicalizes this value to uppercase.
  string bond = 1;
  reserved 2, 3;
  reserved "after", "limit";
}

message ListActiveOffersResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["offers"]}
  };

  repeated SaleOffer offers = 1;
}

message ListActiveBondSeriesRequest {}

message ListActiveBondSeriesResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["bond_series"]}
  };

  repeated string bond_series = 1;
}

message CheckHealthRequest {}

message CheckHealthResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["status"]}
  };

  string status = 1;
}

message SaleOffer {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["id", "seller_id", "bond_series", "price", "currency_code"]}
  };

  string id = 1;
  string seller_id = 2;
  string bond_series = 3;
  // Exact decimal monetary amount encoded as a string.
  string price = 4;
  string currency_code = 5;
}

message BuyResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["offer", "buyer_id", "bought_at"]}
  };

  SaleOffer offer = 1;
  string buyer_id = 2;
  google.protobuf.Timestamp bought_at = 3;
}

// Error is the REST error response. Native gRPC callers receive the equivalent status code and message.
message Error {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {required: ["error"]}
  };

  string error = 1;
}
