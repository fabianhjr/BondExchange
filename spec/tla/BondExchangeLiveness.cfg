\* Liveness instance.
\*
\* Weak fairness on buy resolution requires that a claimed binding order is
\* always resolved into a committed purchase or a recorded rejection. Liveness
\* checking is more expensive than invariant checking and the fairness
\* condition is a conjunction over every possible pending order, so this
\* instance keeps every dimension at the minimum that still lets two buyers
\* contend for one offer.
CONSTANTS
  Users = {user_1, user_2}
  Clients = {client_1}
  Bonds = {"BND"}
  SaleOfferIds = {offer_1}
  Prices = {100}
  MXN = "MXN"
  IdempotencyKeys = {key_1}
  RequestDigests = {digest_1}
  MaxGrantGeneration = 1

SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE

PROPERTIES
  EveryInFlightBuyIsResolved
  EveryClaimIsEventuallyResolved
