\* Marketplace safety instance.
\*
\* Two principals give two authorized buyers that can hold simultaneous
\* claims on one offer, so exclusivity is decided by the resolution rule
\* rather than by an atomic action. Two offer identities and two prices make
\* offer-term immutability and identity reuse falsifiable. Two request
\* digests make the conflicting-retry path reachable. Authorization is fixed
\* here; grants, revocations, and suspensions are checked by
\* BondExchangeAuthorization.cfg.
CONSTANTS
  Principals = {principal_1, principal_2}
  Clients = {client_1}
  Bonds = {"BND"}
  SaleOfferIds = {offer_1, offer_2}
  Prices = {100, 200}
  MXN = "MXN"
  IdempotencyKeys = {key_1}
  RequestDigests = {digest_1, digest_2}
  MaxGrantGeneration = 1

SPECIFICATION MarketplaceSpec
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  ResultShapeIsWellFormed
  UniqueSaleOfferIds
  AtMostOnePurchasePerOffer
  ActiveAndPurchasedOffersAreDisjoint
  EveryPurchasedOfferWasPublished
  AllPublishedOffersAreMXN
  NoSelfPurchases
  EveryResultHasAClaim
  ResultsReferenceKnownResources
  EveryFactHasASucceededOperation
  OfferSellersMatchOperationPrincipals
  PurchaseBuyersMatchOperationPrincipals
  UniqueClaimScopes
  AtMostOneResultPerClaim
  InFlightBuysAreClaimedAndUnresolved
  BuyIsClaimableForAnActiveOffer
  RetriesAreTotal

PROPERTIES
  FactsAreAppendOnly
  OfferTermsAreImmutable
  PurchasedOffersStayPurchased
  SaleOfferIdsAreNeverReused
  ClaimDigestsAreImmutable
