\* Authorization safety instance.
\*
\* Two grant generations let access be revoked and then restored by a new
\* append-only grant rather than by retracting a fact. Two principals make a
\* role-permission revocation observable across principals while a
\* principal-role revocation or suspension affects one. The market is kept
\* deliberately small because authorization and marketplace state multiply;
\* contention and provenance are checked by BondExchange.cfg.
CONSTANTS
  Principals = {principal_1, principal_2}
  Clients = {client_1}
  Bonds = {"BND"}
  SaleOfferIds = {offer_1}
  Prices = {100}
  MXN = "MXN"
  IdempotencyKeys = {key_1}
  RequestDigests = {digest_1}
  MaxGrantGeneration = 2

SPECIFICATION AuthorizationSpec
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  ResultShapeIsWellFormed
  AtMostOnePurchasePerOffer
  NoSelfPurchases
  EveryFactHasASucceededOperation
  UniqueClaimScopes
  AtMostOneResultPerClaim
  EffectivePermissionsMatchAuthorizationFacts
  SuspendedPrincipalsHaveNoPermissions
  RevocationsReferenceGrants
  RetriesAreTotal

PROPERTIES
  FactsAreAppendOnly
  AuthorizationFactsAreAppendOnly
  NewClaimsAreAuthorizedWhenClaimed
