\* Partial-fill safety instance.
\*
\* Two principals can claim one two-unit offer for one unit each. Two offer
\* identities permit the first purchase to create a residual, after which the
\* second claim advances and commits against that successor.
CONSTANTS
  Principals = {principal_1, principal_2, principal_3}
  Clients = {client_1}
  Bonds = {"BND"}
  SaleOfferIds = {offer_1, offer_2}
  Prices = {100}
  Quantities = {1, 2}
  MXN = "MXN"
  IdempotencyKeys = {key_1}
  RequestDigests = {digest_1}
  MaxGrantGeneration = 1

SPECIFICATION PartialFillSpec
SYMMETRY ModelSymmetry
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  ResultShapeIsWellFormed
  UniqueSaleOfferIds
  AtMostOnePurchasePerOffer
  AtMostOneResidualPerPurchase
  ActiveAndPurchasedOffersAreDisjoint
  EveryPurchasedOfferWasPublished
  AllPublishedOffersAreMXN
  NoSelfPurchases
  PurchaseQuantitiesDoNotExceedOffers
  EveryResidualHasPurchasedProvenance
  ResidualsConserveQuantityAndTerms
  PartialPurchasesHaveExactlyOneResidual
  EveryResultHasAClaim
  ResultsReferenceKnownResources
  EveryFactHasASucceededOperation
  OfferSellersMatchOperationPrincipals
  PurchaseBuyersMatchOperationPrincipals
  UniqueClaimScopes
  AtMostOneResultPerClaim
  InFlightBuysAreClaimedAndUnresolved
  BuyIsClaimableForAnActiveOffer
  RetriesAreTotal

PROPERTIES
  FactsAreAppendOnly
  OfferTermsAreImmutable
  PurchasedOffersStayPurchased
  SaleOfferIdsAreNeverReused
  ClaimDigestsAreImmutable
