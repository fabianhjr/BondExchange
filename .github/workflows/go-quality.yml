name: Go quality

on:
  pull_request:
    paths:
      - ".github/workflows/go-quality.yml"
      - "AGENTS.md"
      - "FRICTIONS.md"
      - "SECURITY.md"
      - "application/**"
      - "api/**"
      - "db/**"
      - "docs/adr/**"
      - "docs/FMEA.md"
      - "docs/observability.md"
      - "docs/security/**"
      - "nix/**"
      - "tests/**"
      - "README.md"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"
      - ".gitmodules"
      - "third_party/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/go-quality.yml"
      - "AGENTS.md"
      - "FRICTIONS.md"
      - "SECURITY.md"
      - "application/**"
      - "api/**"
      - "db/**"
      - "docs/adr/**"
      - "docs/FMEA.md"
      - "docs/observability.md"
      - "docs/security/**"
      - "nix/**"
      - "tests/**"
      - "README.md"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"
      - ".gitmodules"
      - "third_party/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates (excluding mutation)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # `security:check` verifies the ASVS profile against the pinned upstream
      # source in the third_party/asvs submodule.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      # `dev:ci` is the aggregate of every gate that `devenv test` runs except
      # mutation testing, which the job below runs. `dev:check` fails when a
      # task attaches itself to `devenv:enterTest` without joining an
      # aggregate, so this workflow cannot silently diverge from `devenv test`.
      - name: Run quality gates
        env:
          CI: "true"
        run: devenv tasks run dev:ci

      - name: Upload integration load reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-load-smoke
          path: .artifacts/integration-load/
          if-no-files-found: ignore

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-coverage
          path: .artifacts/coverage.out
          if-no-files-found: ignore

      - name: Upload module inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-module-inventory
          path: .artifacts/go-modules.json
          if-no-files-found: ignore

      - name: Upload observability contract report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: observability-contract
          path: .artifacts/observability-test.json
          if-no-files-found: ignore

  mutation:
    name: Mutation efficacy (minimum 95%)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Run mutation gate
        env:
          CI: "true"
        run: devenv tasks run go:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-mutation-report
          path: .artifacts/mutation-report.json
          if-no-files-found: ignore
